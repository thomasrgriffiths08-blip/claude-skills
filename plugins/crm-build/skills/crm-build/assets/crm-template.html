function renderBoard() {
  $("board").innerHTML = CONFIG.stages.map(stage => {
    const cards = db.contacts.filter(c => c.status === "open" && c.stage === stage && matches(c));
    const total = cards.reduce((s, c) => s + c.value, 0);
    const color = stageColor(stage);
    return `
      <div class="col" data-stage="${esc(stage)}">
        <div class="col-head">
          <div class="col-title">
            <span class="col-dot" style="background:${color}"></span>
            <span class="col-name">${esc(stage)}</span>
            <span class="col-count">${cards.length}</span>
            <button class="col-add" data-stage="${esc(stage)}" title="Add opportunity in ${esc(stage)}">+</button>
          </div>
          <div class="col-total">${fmtMoney(total)}</div>
          <div class="col-strip" style="background:${color}"></div>
        </div>
        <div class="col-body">${cards.map(cardHTML).join("")}</div>
      </div>`;
  }).join("");
  wireDragAndDrop();

  const live = db.contacts.filter(c => c.status === "open" && c.stage !== CONFIG.paidStage && matches(c));
  $("pipelineTotal").textContent = fmtMoney(live.reduce((s, c) => s + c.value, 0));
}

function wireDragAndDrop() {
  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("dragstart", e => {
      dragInFlight = true;
      e.dataTransfer.setData("text/plain", el.dataset.id);
      e.dataTransfer.effectAllowed = "move";
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      setTimeout(() => { dragInFlight = false; }, 80);
    });
    el.addEventListener("click", () => {
      if (dragInFlight) return;
      openDrawer(el.dataset.id);
    });
    el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      const c = byId(el.dataset.id);
      if (!c) return;
      if (b.dataset.act === "call" && c.phone) doCall(c);
      else openDrawer(c.id);
    }));
  });
  document.querySelectorAll(".col-add").forEach(b => b.addEventListener("click", () => openModal(null, b.dataset.stage)));
  document.querySelectorAll(".col-body").forEach(body => {
    body.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; body.classList.add("drag-over"); });
    body.addEventListener("dragleave", () => body.classList.remove("drag-over"));
    body.addEventListener("drop", e => {
      e.preventDefault();
      body.classList.remove("drag-over");
      moveStage(e.dataTransfer.getData("text/plain"), body.closest(".col").dataset.stage);
    });
  });
}

function moveStage(id, stage) {
  const c = byId(id);
  if (!c || c.stage === stage) return;
  snapshot();
  c.stage = stage;
  if (stageIdx(stage) >= wonIdx() && !c.wonAt) c.wonAt = nowTs();
  if (stage === CONFIG.paidStage && !c.paidAt) c.paidAt = nowTs();
  c.activity.push({ ts: nowTs(), type: "stage", text: "Moved to " + stage });
  save();
  renderAll();
  toast(c.name + " → " + stage, { undo: true });
}

/* ---------- contacts table ---------- */
const contactSel = new Set();
function renderContacts() {
  const statusRank = { open: 0, archived: 1, lost: 2 };
  const rows = db.contacts
    .filter(c => (filters.status === "all" || c.status === filters.status) && matches(c))
    .sort((a, b) => statusRank[a.status] - statusRank[b.status] || stageIdx(a.stage) - stageIdx(b.stage) || b.value - a.value);
  const lastAct = c => c.activity.length ? fmtAgo(c.activity[c.activity.length - 1].ts) : "—";
  const chip = c => c.status === "lost"
    ? `<span class="stage-chip lost">Lost</span>`
    : c.status === "archived"
      ? `<span class="stage-chip archived">${esc(c.stage)} · archived</span>`
      : `<span class="stage-chip ${c.stage === CONFIG.paidStage ? "paid" : ""}">${esc(c.stage)}</span>`;
  const allChecked = rows.length > 0 && rows.every(c => contactSel.has(c.id));
  $("contactsWrap").innerHTML = `
    <div class="view-head" style="padding:0.2rem 0 0.9rem">
      <div><h2>Contacts</h2><div class="vh-sub">${rows.length} shown · ${db.contacts.length} total</div></div>
      <div class="vh-spacer"></div>
      <button class="btn-ghost" id="cImport">Import CSV</button>
      <button class="btn-ghost" id="cExport">Export CSV</button>
    </div>
    ${contactSel.size ? `
    <div class="bulk-bar">
      <span>${contactSel.size} selected</span>
      <button class="btn-ghost" id="bulkExport">Export selected</button>
      <button class="btn-ghost" id="bulkDelete" style="color:var(--red)">Delete selected</button>
      <button class="btn-ghost" id="bulkClear">Clear</button>
    </div>` : ""}
    <table>
      <thead><tr>
        <th style="width:34px"><input type="checkbox" class="ck" id="ckAll" ${allChecked ? "checked" : ""}></th>
        <th>Name</th><th>Stage</th><th>Job type</th><th>Value</th><th>Source</th><th>Follow-up</th><th>Last activity</th><th>Phone</th>
      </tr></thead>
      <tbody>
        ${rows.map(c => {
          const fu = fuInfo(c);
          return `
          <tr data-id="${c.id}">
            <td><input type="checkbox" class="ck" data-ck="${c.id}" ${contactSel.has(c.id) ? "checked" : ""}></td>
            <td><div class="t-id">${avatarHTML(c.name, 30)}<b>${esc(c.name)}</b></div></td>
            <td>${chip(c)}</td>
            <td>${esc(c.jobType)}</td>
            <td class="td-value">${fmtMoney(c.value)}</td>
            <td>${esc(c.source)}</td>
            <td>${fu && c.status === "open" ? `<span class="fu-badge ${fu.cls}">${fu.label}</span>` : "—"}</td>
            <td>${lastAct(c)}</td>
            <td>${esc(c.phone)}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    <div class="pager">
      <span>1–${rows.length} of ${rows.length}</span>
      <button class="btn-ghost" disabled>Prev</button>
      <button class="btn-ghost" disabled>Next</button>
    </div>`;
  $("contactsWrap").querySelectorAll("tbody tr").forEach(tr =>
    tr.addEventListener("click", () => openDrawer(tr.dataset.id)));
  $("contactsWrap").querySelectorAll("[data-ck]").forEach(ck => ck.addEventListener("click", e => {
    e.stopPropagation();
    ck.checked ? contactSel.add(ck.dataset.ck) : contactSel.delete(ck.dataset.ck);
    renderContacts();
  }));
  const ckAll = $("ckAll");
  if (ckAll) ckAll.addEventListener("click", e => {
    e.stopPropagation();
    rows.forEach(c => ckAll.checked ? contactSel.add(c.id) : contactSel.delete(c.id));
    renderContacts();
  });
  $("cExport").addEventListener("click", () => exportCSV());
  $("cImport").addEventListener("click", () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".csv,text/csv";
    inp.onchange = e => { if (e.target.files[0]) importCSV(e.target.files[0]); };
    inp.click();
  });
  const bulkExport = $("bulkExport");
  if (bulkExport) {
    bulkExport.addEventListener("click", () => exportCSV(db.contacts.filter(c => contactSel.has(c.id))));
    $("bulkDelete").addEventListener("click", () => {
      snapshot();
      const n = contactSel.size;
      db.contacts = db.contacts.filter(c => !contactSel.has(c.id));
      contactSel.clear();
      save(); renderAll();
      toast("Deleted " + n + " contact" + (n === 1 ? "" : "s"), { undo: true });
    });
    $("bulkClear").addEventListener("click", () => { contactSel.clear(); renderContacts(); });
  }
}

/* ---------- drawer (contact detail + activity log) ---------- */
const ACT_LABELS = { call: "Call", text: "Text", email: "Email", quote: "Quote sent", note: "Note", stage: "Stage" };

function closeDrawer() { $("drawerOverlay").classList.remove("show"); }

function openDrawer(id) {
  const c = byId(id);
  if (!c) return;
  const acts = [...c.activity].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const statusChip = c.status === "lost" ? `<span class="stage-chip lost">Lost</span>`
    : c.status === "archived" ? `<span class="stage-chip archived">Archived</span>` : "";
  const sortedTasks = [...c.tasks.filter(t => !t.done), ...c.tasks.filter(t => t.done)];
  $("drawerPanel").innerHTML = `
    <div class="d-head">
      <div class="d-id">
        ${avatarHTML(c.name, 46)}
        <div>
          <div class="d-name">${esc(c.name)}</div>
          <div class="d-meta">${esc(c.jobType)} <span class="stage-chip ${c.stage === CONFIG.paidStage ? "paid" : ""}">${esc(c.stage)}</span>${statusChip}</div>

      </div>
      <div class="d-value">${fmtMoney(c.value)}</div>
    </div>
    <div class="d-quick">

      ${c.email ? `<button id="qEmail">Email</button>` : ""}
      <button id="qQuote">Quote PDF</button>
      <button id="qInvoice">Invoice PDF</button>
    </div>
    <div class="info-list">
      ${c.phone ? `<div class="info-row"><span class="k">Phone</span><a href="tel:${esc(c.phone.replace(/\s/g, ""))}">${esc(c.phone)}</a></div>` : ""}
      ${c.email ? `<div class="info-row"><span class="k">Email</span><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>` : ""}
      ${c.address ? `<div class="info-row"><span class="k">Address</span><span>${esc(c.address)}</span></div>` : ""}
      <div class="info-row"><span class="k">Source</span><span>${esc(c.source)}</span></div>
      <div class="info-row"><span class="k">Added</span><span>${fmtAgo(c.createdAt)}</span></div>
      ${c.status === "lost" ? `<div class="info-row"><span class="k">Lost</span><span>${esc(c.lostReason)} · ${fmtAgo(c.lostAt)}</span></div>` : ""}
    </div>
    ${c.notes ? `<div class="d-notes">${esc(c.notes)}</div>` : ""}
    <div class="d-fu-row">
      <label for="dFollowUp">Follow-up</label>
      <input type="date" id="dFollowUp" value="${esc(c.followUp)}">
      ${fuInfo(c) ? `<span class="fu-badge ${fuInfo(c).cls}">${fuInfo(c).label}</span>` : ""}
    </div>
    <div class="section-title">Tasks</div>
    <div class="task-add">
      <input type="text" id="taskText" placeholder="Add a task — e.g. order materials">
      <input type="date" id="taskDue">
      <button class="btn-primary" id="taskAdd">Add</button>
    </div>
    ${sortedTasks.map(t => {
      const od = t.due && !t.done && daysUntil(t.due) < 0;
      return `
      <div class="task-row ${t.done ? "done" : ""}">
        <input type="checkbox" data-task="${t.id}" ${t.done ? "checked" : ""}>
        <span class="t-text">${esc(t.text)}</span>
        ${t.due ? `<span class="t-due ${od ? "overdue" : ""}">${od ? (-daysUntil(t.due)) + "d overdue" : fmtDay(t.due)}</span>` : ""}
      </div>`;
    }).join("")}
    <div class="section-title" style="margin-top:1.1rem">Activity</div>
    <div class="quick-log">
      <select id="logType">
        <option value="call">Call</option>
        <option value="text">Text</option>
        <option value="email">Email</option>
        <option value="quote">Quote sent</option>
        <option value="note">Note</option>
      </select>
      <input type="text" id="logText" placeholder="What happened?">
      <button class="btn-primary" id="logBtn">Log</button>
    </div>
    <div class="act-list">
      ${acts.map(a => `
        <div class="act-item">
          <span class="act-chip ${a.type === "stage" ? "stage" : ""}">${esc(ACT_LABELS[a.type] || a.type)}</span>
          <span class="act-text">${esc(a.text)}</span>
          <span class="act-time">${fmtAgo(a.ts)}</span>

    c.tasks.push({ id: uid(), text, due: $("taskDue").value, done: false, createdAt: nowTs(), doneAt: null });

  });
  $("taskText").addEventListener("keydown", e => { if (e.key === "Enter") $("taskAdd").click(); });
  $("drawerPanel").querySelectorAll("[data-task]").forEach(cb => cb.addEventListener("change", () => {

    t.done = cb.checked;
    t.doneAt = cb.checked ? nowTs() : null;
    if (cb.checked) c.activity.push({ ts: nowTs(), type: "note", text: "Task done — " + t.text });

  $("logBtn").addEventListener("click", () => {

    save(); renderAll(); openDrawer(id);
    $("logText").value = "";
  });

  $("dDelete").addEventListener("click", () => {
    snapshot();

    $("dLost").addEventListener("click", () => {

        <button class="btn-danger" id="lostConfirm">Confirm lost</button>
        <button class="btn-ghost" id="lostCancel">Cancel</button>`;

      $("lostCancel").addEventListener("click", () => openDrawer(id));
      $("lostConfirm").addEventListener("click", () => {
        snapshot();
        c.status = "lost";
        c.lostAt = nowTs();
        c.lostReason = $("lostReason").value.trim() || "No reason given";
        c.activity.push({ ts: nowTs(), type: "note", text: "Marked lost — " + c.lostReason });
        save(); renderAll(); closeDrawer();
        toast(c.name + " marked lost", { undo: true });
      });
    });
  } else {
    $("dReopen").addEventListener("click", () => {
      snapshot();
      c.status = "open";
      c.activity.push({ ts: nowTs(), type: "note", text: "Reopened" });
      save(); renderAll(); openDrawer(id);
      toast(c.name + " reopened", { undo: true });
    });
  }
  const archBtn = $("dArchive");
  if (archBtn) archBtn.addEventListener("click", () => {
    snapshot();
    c.status = "archived";
    c.activity.push({ ts: nowTs(), type: "note", text: "Archived" });
    save(); renderAll(); closeDrawer();
    toast(c.name + " archived", { undo: true });
  });
  const newJobBtn = $("dNewJob");
  if (newJobBtn) newJobBtn.addEventListener("click", () => {
    snapshot();
    const nc = {
      id: uid(), name: c.name, phone: c.phone, email: c.email, address: c.address,
      jobType: c.jobType, value: 0,
      source: CONFIG.sources.includes("Repeat Customer") ? "Repeat Customer" : c.source,
      stage: CONFIG.stages[0], status: "open", followUp: "", notes: "",
      createdAt: nowTs(), wonAt: null, paidAt: null, lostAt: null, lostReason: "", tasks: [],
      activity: [{ ts: nowTs(), type: "note", text: "New job for returning customer" }]
    };
    db.contacts.push(nc);
    save(); renderAll(); openDrawer(nc.id);

  $("dClose").addEventListener("click", closeDrawer);
}

/* ---------- add / edit modal ---------- */
function closeModal() { $("modalOverlay").classList.remove("show"); }

function openModal(id, presetStage) {
  const c = id ? byId(id) : null;
  const opts = (list, sel) => list.map(o => `<option ${o === sel ? "selected" : ""}>${esc(o)}</option>`).join("");
  $("modalPanel").innerHTML = `
    <h2>${c ? "Edit contact" : "New contact"}</h2>
    <form id="contactForm">
      <div class="form-grid">
        <div class="field full"><label>Name</label><input id="mName" required value="${esc(c?.name)}"></div>
        <div class="field"><label>Phone</label><input id="mPhone" value="${esc(c?.phone)}"></div>
        <div class="field"><label>Email</label><input id="mEmail" type="email" value="${esc(c?.email)}"></div>
        <div class="field full"><label>Address</label><input id="mAddress" value="${esc(c?.address)}"></div>
        <div class="field"><label>Job type</label><select id="mJobType">${opts(CONFIG.jobTypes, c?.jobType)}</select></div>
        <div class="field"><label>Value (${esc(CONFIG.currency)})</label><input id="mValue" type="number" min="0" step="1" value="${c ? c.value : ""}" placeholder="e.g. 2450"></div>
        <div class="field"><label>Source</label><select id="mSource">${opts(CONFIG.sources, c?.source)}</select></div>
        <div class="field"><label>Stage</label><select id="mStage">${opts(CONFIG.stages, c?.stage ?? CONFIG.stages[0])}</select></div>
        <div class="field"><label>Follow-up date</label><input id="mFollowUp" type="date" value="${esc(c?.followUp)}"></div>
        <div class="field full"><label>Notes</label><textarea id="mNotes">${esc(c?.notes)}</textarea></div>
      </div>
      <div class="panel-actions">
        <button type="button" class="btn-ghost" id="modalCancel">Cancel</button>
        <button type="submit" class="btn-primary">${c ? "Save changes" : "Add contact"}</button>
      </div>
    </form>`;
  $("modalOverlay").classList.add("show");
  if (!c && presetStage && CONFIG.stages.includes(presetStage)) $("mStage").value = presetStage;
  $("mName").focus();

  $("modalCancel").addEventListener("click", closeModal);
  $("contactForm").addEventListener("submit", e => {
    e.preventDefault();
    const vals = {
      name: $("mName").value.trim(),
      phone: $("mPhone").value.trim(),
      email: $("mEmail").value.trim(),
      address: $("mAddress").value.trim(),
      jobType: $("mJobType").value,
      value: Math.max(0, parseInt($("mValue").value, 10) || 0),
      source: $("mSource").value,
      stage: $("mStage").value,
      followUp: $("mFollowUp").value,
      notes: $("mNotes").value.trim()
    };
    if (!vals.name) return;
    if (c) {
      const stageChanged = c.stage !== vals.stage;
      Object.assign(c, vals);
      if (stageChanged) {
        if (stageIdx(vals.stage) >= wonIdx() && !c.wonAt) c.wonAt = nowTs();
        if (vals.stage === CONFIG.paidStage && !c.paidAt) c.paidAt = nowTs();
        c.activity.push({ ts: nowTs(), type: "stage", text: "Moved to " + vals.stage });
      }
      c.activity.push({ ts: nowTs(), type: "note", text: "Details updated" });
    } else {
      const digits = p => String(p).replace(/\D/g, "");
      const dup = vals.phone && db.contacts.find(x => x.phone && digits(x.phone) === digits(vals.phone));
      db.contacts.push({
        id: uid(), createdAt: nowTs(),
        wonAt: stageIdx(vals.stage) >= wonIdx() ? nowTs() : null,
        paidAt: vals.stage === CONFIG.paidStage ? nowTs() : null,
        status: "open", tasks: [], lostAt: null, lostReason: "",
        activity: [{ ts: nowTs(), type: "note", text: "Contact added" }],
        ...vals
      });
      if (dup) toast("Heads up — same phone number as " + dup.name, { warn: true });
    }
    save(); renderAll(); closeModal();
  });
}

/* ---------- dashboard ---------- */
let countUpRaf = null;
function countUp(el, target) {
  cancelAnimationFrame(countUpRaf);
  const dur = 1200, start = performance.now();
  const step = now => {
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtMoney(target * eased);
    if (p < 1) countUpRaf = requestAnimationFrame(step);
  };
  countUpRaf = requestAnimationFrame(step);
}

function renderDashboard() {
  const cs = db.contacts;
  const open = cs.filter(c => c.status === "open");
  const live = open.filter(c => c.stage !== CONFIG.paidStage);
  const liveTotal = live.reduce((s, c) => s + c.value, 0);
  $("dashSub").textContent = CONFIG.shortName + " — live";
  $("heroSub").textContent = "across " + live.length + " open job" + (live.length === 1 ? "" : "s");
  countUp($("heroNumber"), liveTotal);

  /* stage funnel widget */
  const fTotals = CONFIG.stages.map(stage => {
    const list = open.filter(c => c.stage === stage);
    return { stage, n: list.length, val: list.reduce((s, c) => s + c.value, 0) };
  });
  const fMax = Math.max(...fTotals.map(f => f.val), 1);
  $("funnel").innerHTML = fTotals.map(f => `
    <div class="funnel-row">
      <span class="fname">${esc(f.stage)}</span>
      <div class="f-track"><div class="f-fill" style="width:0%;background:${stageColor(f.stage)}" data-w="${(f.val / fMax * 100).toFixed(1)}"></div></div>
      <span class="f-meta">${f.n} <span>· ${fmtMoney(f.val)}</span></span>
    </div>`).join("");

  const now = new Date();
  const won = cs.filter(c => c.wonAt && c.status !== "lost");
  const wonThisMonth = won.filter(c => {
    const d = new Date(c.wonAt);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const wonValue = wonThisMonth.reduce((s, c) => s + c.value, 0);
  const lost = cs.filter(c => c.status === "lost");
  const decided = won.length + lost.length;
  const winRate = decided ? Math.round(won.length / decided * 100) : 0;
  const conversion = cs.length ? Math.round(won.length / cs.length * 100) : 0;
  const avgJob = won.length ? won.reduce((s, c) => s + c.value, 0) / won.length : 0;
  const winDays = won.filter(c => c.createdAt).map(c => (new Date(c.wonAt) - new Date(c.createdAt)) / DAY);
  const avgDays = winDays.length ? Math.round(winDays.reduce((a, b) => a + b, 0) / winDays.length) : 0;
  const invoiceStage = CONFIG.stages[stageIdx(CONFIG.paidStage) - 1];
  const awaiting = open.filter(c => c.stage === invoiceStage);
  const awaitingTotal = awaiting.reduce((s, c) => s + c.value, 0);

  const statCard = (ic, tint, num, label, sub) => `
    <div class="stat">
      <div class="stat-ic ${tint}">${ic}</div>
      <div class="stat-body">
        <div class="stat-num ${tint === "green" ? "green" : ""}">${num}</div>
        <div class="stat-label">${label}</div>
        <div class="stat-sub">${sub}</div>
      </div>
    </div>`;
  $("statRow").innerHTML =
    statCard(SICONS.won, "green", wonThisMonth.length, "Jobs won this month", `<b>${fmtMoney(wonValue)}</b> in work booked`) +
    statCard(SICONS.conv, "", conversion + "%", "Conversion rate", `<b>${won.length}</b> of <b>${cs.length}</b> enquiries became jobs`) +
    statCard(SICONS.wait, "amber", fmtMoney(awaitingTotal), "Awaiting payment", `<b>${awaiting.length}</b> job${awaiting.length === 1 ? "" : "s"} done, not yet paid`) +
    statCard(SICONS.rate, "", winRate + "%", "Win rate", `of <b>${decided}</b> decided quotes · <b>${lost.length}</b> lost`) +
    statCard(SICONS.avg, "", fmtMoney(avgJob), "Average job value", `across <b>${won.length}</b> won jobs`) +
    statCard(SICONS.days, "blue", avgDays, "Days to win a job", "from enquiry to booked, on average");

  /* money in — last 6 months, from paid dates */
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ key: d.getFullYear() + "-" + d.getMonth(), label: d.toLocaleDateString("en-GB", { month: "short" }), total: 0 });
  }
  cs.forEach(c => {
    if (!c.paidAt || c.status === "lost") return;
    const d = new Date(c.paidAt);
    const m = months.find(x => x.key === d.getFullYear() + "-" + d.getMonth());
    if (m) m.total += c.value;
  });
  const rmax = Math.max(...months.map(m => m.total), 1);
  $("revChart").innerHTML = months.map(m => `
    <div class="rev-col">
      <span class="rev-val">${m.total ? fmtMoney(m.total) : ""}</span>
      <div class="rev-bar" style="height:3px" data-h="${(m.total / rmax * 100).toFixed(1)}"></div>
      <span class="rev-month">${m.label}</span>
    </div>`).join("");

  /* which lead source actually pays — donut + table */
  const bySrc = CONFIG.sources.map(src => {
    const all = cs.filter(c => c.source === src);
    const w = all.filter(c => c.wonAt && c.status !== "lost");
    return { src, n: all.length, won: w.length, val: w.reduce((s, c) => s + c.value, 0) };
  }).filter(r => r.n).sort((a, b) => b.val - a.val);
  const withVal = bySrc.filter(r => r.val > 0);
  const totalWonVal = bySrc.reduce((s, r) => s + r.val, 0);
  const DONUT = ["#18181b", "#52525b", "#8a8a93", "#b3b3ba", "#2563eb", "#d4d4d8"];
  const colorOf = r => { const i = withVal.indexOf(r); return i > -1 ? DONUT[i % DONUT.length] : "#3a4552"; };
  const CIRC = 2 * Math.PI * 44;
  let acc = 0;
  const segs = withVal.map(r => {
    const frac = r.val / (totalWonVal || 1);
    const seg = `<circle cx="70" cy="70" r="44" fill="none" stroke="${colorOf(r)}" stroke-width="16"
      stroke-dasharray="${Math.max(frac * CIRC - 2, 0.6).toFixed(1)} ${CIRC.toFixed(1)}"
      stroke-dashoffset="${(-acc * CIRC).toFixed(1)}" transform="rotate(-90 70 70)"/>`;
    acc += frac;
    return seg;
  }).join("");
  $("srcTable").innerHTML = `
    <div class="src-grid">
      <div class="donut-wrap">
        <svg viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="44" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="16"/>
          ${segs}
          <text x="70" y="67" text-anchor="middle" class="donut-num">${fmtMoney(totalWonVal)}</text>
          <text x="70" y="81" text-anchor="middle" class="donut-sub">won all-time</text>
        </svg>
      </div>
      <table class="src-table">
        <thead><tr><th>Source</th><th>Enquiries</th><th>Won</th><th>Win %</th><th>£ won</th></tr></thead>
        <tbody>${bySrc.map(r => `
          <tr><td><span class="src-dot" style="background:${colorOf(r)}"></span><b>${esc(r.src)}</b></td><td>${r.n}</td><td>${r.won}</td>
          <td>${Math.round(r.won / r.n * 100)}%</td><td class="td-value">${fmtMoney(r.val)}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    $("funnel").querySelectorAll(".f-fill").forEach(f => { f.style.width = f.dataset.w + "%"; });
    $("revChart").querySelectorAll(".rev-bar").forEach(f => { f.style.height = f.dataset.h + "%"; });
  }));
}

/* ---------- Today (agenda) ---------- */
function agendaItems() {
  const items = [];
  db.contacts.filter(c => c.status === "open").forEach(c => {
    if (c.followUp && c.stage !== CONFIG.paidStage)
      items.push({ kind: "followup", c, due: c.followUp, days: daysUntil(c.followUp), text: "Follow up — " + c.stage.toLowerCase() });
    c.tasks.filter(t => !t.done).forEach(t =>
      items.push({ kind: "task", c, t, due: t.due, days: t.due ? daysUntil(t.due) : 999, text: t.text }));
  });
  return items.sort((a, b) => a.days - b.days);
}
function renderToday() {
  const items = agendaItems();
  const groups = [
    { title: "Overdue", cls: "red", list: items.filter(i => i.due && i.days < 0) },
    { title: "Today", cls: "", list: items.filter(i => i.due && i.days === 0) },
    { title: "Next 7 days", cls: "", list: items.filter(i => i.due && i.days > 0 && i.days <= 7) },
    { title: "Later / no date", cls: "", list: items.filter(i => !i.due || i.days > 7) }
  ];
  const todayHead = `
    <div class="view-head" style="padding:0 0 1rem">
      <div><h2>Today</h2><div class="vh-sub">${new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })}</div></div>
    </div>`;
  $("agenda").innerHTML = todayHead + (items.length ? groups.filter(g => g.list.length).map(g => `
    <div class="ag-group">
      <div class="ag-title ${g.cls}">${g.title} · ${g.list.length}</div>
      ${g.list.map(i => `
        <div class="ag-row">
          ${avatarHTML(i.c.name, 30)}
          <span class="ag-chip ${i.kind === "task" ? "task" : ""}">${i.kind === "task" ? "Task" : "Follow-up"}</span>
          <div class="ag-what"><b>${esc(i.c.name)}</b><span>${esc(i.text)} · ${fmtMoney(i.c.value)}</span></div>
          <span class="ag-due ${i.days < 0 && i.due ? "overdue" : ""}">${i.due ? (i.days < 0 ? (-i.days) + "d overdue" : i.days === 0 ? "Today" : fmtDay(i.due)) : "No date"}</span>
          <button class="btn-ghost" data-done="${i.c.id}|${i.kind}|${i.kind === "task" ? i.t.id : ""}">Done</button>
          <button class="btn-ghost" data-open="${i.c.id}">Open</button>
        </div>`).join("")}
    </div>`).join("")
    : `<div class="ag-empty">Nothing scheduled. Set follow-up dates or add tasks from any contact.</div>`);
  $("agenda").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openDrawer(b.dataset.open)));
  $("agenda").querySelectorAll("[data-done]").forEach(b => b.addEventListener("click", () => {
    const [cid, kind, tid] = b.dataset.done.split("|");
    const c = byId(cid);
    if (!c) return;
    snapshot();
    if (kind === "task") {
      const t = c.tasks.find(x => x.id === tid);
      if (t) { t.done = true; t.doneAt = nowTs(); c.activity.push({ ts: nowTs(), type: "note", text: "Task done — " + t.text }); }
    } else {
      c.followUp = "";
      c.activity.push({ ts: nowTs(), type: "note", text: "Followed up" });
    }
    save(); renderAll();
    toast("Done — " + c.name, { undo: true });
  }));
}

/* ---------- quote / invoice documents ---------- */
function openDoc(id, kind) {
  const c = byId(id);
  if (!c) return;
  db.docs[kind] = (db.docs[kind] || 0) + 1;
  const ref = (kind === "quote" ? "Q-" : "INV-") + String(db.docs[kind]).padStart(4, "0");
  c.activity.push({ ts: nowTs(), type: kind === "quote" ? "quote" : "note", text: (kind === "quote" ? "Quote " : "Invoice ") + ref + " generated — " + fmtMoney(c.value) });
  save(); renderAll(); openDrawer(id);
  const today = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  const hasVat = !!CONFIG.vatNo && CONFIG.vatRate > 0;
  const net = hasVat ? c.value / (1 + CONFIG.vatRate / 100) : c.value;
  const vat = c.value - net;
  $("docPaper").innerHTML = `
    <div class="doc-top">
      <div class="doc-biz">
        <div class="doc-brandrow">
          <span class="doc-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14.5 L9 8.2 L12.4 11.6"/><path d="M7.8 17.8 L13.8 10.8 L20.5 17.8"/></svg></span>
          <b>${esc(CONFIG.businessName)}</b>
        </div>
        <div>${esc(CONFIG.address)}<br>${esc(CONFIG.phone)} · ${esc(CONFIG.email)}${CONFIG.vatNo ? "<br>VAT No. " + esc(CONFIG.vatNo) : ""}</div>
      </div>
      <div class="doc-kind"><b>${kind === "quote" ? "QUOTE" : "INVOICE"}</b><div>${ref}</div><div>${today}</div></div>
    </div>
    <div class="doc-to"><span class="k">${kind === "quote" ? "Quoted to" : "Billed to"}</span><div><b>${esc(c.name)}</b><br>${esc(c.address)}</div></div>
    <table class="doc-table">
      <thead><tr><th>Description</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody><tr><td>${esc(c.jobType)} — ${esc(c.address)}</td><td class="amt">${fmtMoney2(net)}</td></tr></tbody>
    </table>
    <div class="doc-totals">
      ${hasVat ? `<div class="row"><span>Subtotal</span><span>${fmtMoney2(net)}</span></div>
      <div class="row"><span>VAT @ ${CONFIG.vatRate}%</span><span>${fmtMoney2(vat)}</span></div>` : ""}
      <div class="row grand"><span>Total</span><span>${fmtMoney2(c.value)}</span></div>
    </div>
    <div class="doc-foot">
      ${kind === "quote"
        ? `This quote is valid for ${CONFIG.quoteValidDays} days from the date above. All work fully guaranteed.`
        : `Payment due within ${CONFIG.paymentTermsDays} days of the date above.<br>Bank transfer to: ${esc(CONFIG.bankDetails)} — reference ${ref}.`}
    </div>
    <div class="doc-actions">
      <button class="btn-ghost" id="docClose">Close</button>
      <button class="btn-primary" id="docPrint">Print / Save PDF</button>
    </div>`;
  $("docOverlay").classList.add("show");
  $("docClose").addEventListener("click", () => $("docOverlay").classList.remove("show"));
  $("docPrint").addEventListener("click", () => window.print());
}

/* ---------- CSV / JSON import & export ---------- */
function downloadFile(name, mime, content) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportCSV(list) {
  const src = Array.isArray(list) ? list : db.contacts;
  const cols = ["name", "phone", "email", "address", "jobType", "value", "source", "stage", "status", "followUp", "notes"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [cols.join(",")].concat(src.map(c => cols.map(k => q(c[k])).join(",")));
  downloadFile("crm-contacts-" + isoDate(new Date()) + ".csv", "text/csv", rows.join("\n"));
  toast("Exported " + src.length + " contact" + (src.length === 1 ? "" : "s"));
}
function parseCSV(text) {
  const rows = [];
  let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.some(v => v !== "")) rows.push(row);
      row = [];
    } else cur += ch;
  }
  row.push(cur);
  if (row.some(v => v !== "")) rows.push(row);
  return rows;
}
function importCSV(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(String(reader.result));
    if (rows.length < 2) { toast("No rows found in that file", { warn: true }); return; }
    const heads = rows[0].map(h => h.toLowerCase().replace(/[^a-z]/g, ""));
    const col = (...names) => { for (const n of names) { const i = heads.indexOf(n); if (i > -1) return i; } return -1; };
    const map = {
      name: col("name", "customer", "client", "contact"),
      phone: col("phone", "mobile", "tel", "telephone", "number"),
      email: col("email", "emailaddress"),
      address: col("address", "addr", "location"),
      jobType: col("jobtype", "job", "type", "service", "work"),
      value: col("value", "price", "amount", "quote", "total"),
      source: col("source", "leadsource", "from"),
      stage: col("stage", "status", "pipeline"),
      followUp: col("followup", "follow", "nextcontact", "next"),
      notes: col("notes", "note", "comments", "comment")
    };
    if (map.name < 0) { toast("Couldn't find a name column in that file", { warn: true }); return; }
    snapshot();
    let added = 0, skipped = 0;
    rows.slice(1).forEach(r => {
      const get = i => (i > -1 && r[i]) ? String(r[i]).trim() : "";
      const name = get(map.name);
      if (!name) { skipped++; return; }
      const stage = CONFIG.stages.find(s => s.toLowerCase() === get(map.stage).toLowerCase()) || CONFIG.stages[0];
      const fuRaw = get(map.followUp);
      db.contacts.push({
        id: uid(), name,
        phone: get(map.phone), email: get(map.email), address: get(map.address),
        jobType: CONFIG.jobTypes.find(j => j.toLowerCase() === get(map.jobType).toLowerCase()) || CONFIG.jobTypes[0],
        value: Math.max(0, Math.round(parseFloat(get(map.value).replace(/[^0-9.]/g, "")) || 0)),
        source: CONFIG.sources.find(s => s.toLowerCase() === get(map.source).toLowerCase()) || CONFIG.sources[0],
        stage, status: "open",
        followUp: /^\d{4}-\d{2}-\d{2}$/.test(fuRaw) ? fuRaw : "",
        notes: get(map.notes),
        createdAt: nowTs(),
        wonAt: stageIdx(stage) >= wonIdx() ? nowTs() : null,
        paidAt: stage === CONFIG.paidStage ? nowTs() : null,
        lostAt: null, lostReason: "", tasks: [],
        activity: [{ ts: nowTs(), type: "note", text: "Imported from spreadsheet" }]
      });
      added++;
    });
    save(); renderAll();
    toast("Imported " + added + " contact" + (added === 1 ? "" : "s") + (skipped ? " · " + skipped + " skipped (no name)" : ""), { undo: true });
  };
  reader.readAsText(file);
}
function exportJSON() {
  downloadFile("crm-backup-" + isoDate(new Date()) + ".json", "application/json", JSON.stringify(db, null, 2));
  toast("Backup downloaded — keep it somewhere safe");
}
function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!Array.isArray(data.contacts)) throw new Error("bad");
      snapshot();
      db = data;
      migrate(); applySettings(); save();
      populateFilters(); renderAll();
      toast("Restored " + db.contacts.length + " contacts", { undo: true });
    } catch (e) {
      toast("That file isn't a CRM backup", { warn: true });
    }
  };
  reader.readAsText(file);
}

      emailTemplate: $("sEmailTpl").value
    };
    applySettings();
    save();
    populateFilters();
    renderAll();
    renderSettings();
    toast("Settings saved");
  });
  $("dataExportCSV").addEventListener("click", exportCSV);
  $("dataExportJSON").addEventListener("click", exportJSON);
  $("dataImportCSV").addEventListener("click", () => $("csvFile").click());
  $("dataImportJSON").addEventListener("click", () => $("jsonFile").click());
  $("csvFile").addEventListener("change", e => { if (e.target.files[0]) importCSV(e.target.files[0]); e.target.value = ""; });
  $("jsonFile").addEventListener("change", e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ""; });
}

function renderCalendar() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const startDow = (new Date(y, m, 1).getDay() + 6) % 7; /* Monday first */
  const dim = new Date(y, m + 1, 0).getDate();
  const dimPrev = new Date(y, m, 0).getDate();
  const EVENTS = [
    { off: -6, label: "Repair — Cartwright", cls: "ev-done" },
    { off: -1, label: "Chimney — Peacock ✓", cls: "ev-done" },
    { off: 0, label: "Tarp check — Kowalski", cls: "ev-visit" },
    { off: 1, label: "Site visit — Bell · 2pm", cls: "ev-visit" },
    { off: 2, label: "Quote — Sharma (slate)", cls: "ev-visit" },
    { off: 3, label: "Invoice due — Cartwright", cls: "ev-money" },
    { off: 5, label: "Scaffold up — Swales", cls: "ev-job" },
    { off: 6, label: "Skip delivery — Baildon", cls: "ev-job" },
    { off: 9, label: "Re-roof starts — Swales", cls: "ev-job" },
    { off: 10, label: "Re-roof — day 2", cls: "ev-job" },
    { off: 12, label: "Fascias — Ibbotson", cls: "ev-job" },
    { off: 13, label: "Fascias — Ibbotson", cls: "ev-job" },
    { off: 16, label: "Moss quote — Menston", cls: "ev-visit" }
  ];
  const byDay = {};
  EVENTS.forEach(e => {
    const d = new Date(Date.now() + e.off * DAY);
    if (d.getMonth() === m && d.getFullYear() === y) (byDay[d.getDate()] = byDay[d.getDate()] || []).push(e);
  });
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const dayNum = i - startDow + 1;
    if (dayNum < 1) cells += `<div class="cal-cell other"><span class="cal-num">${dimPrev + dayNum}</span></div>`;
    else if (dayNum > dim) cells += `<div class="cal-cell other"><span class="cal-num">${dayNum - dim}</span></div>`;
    else {
      const isToday = dayNum === now.getDate();
      cells += `
        <div class="cal-cell ${isToday ? "today" : ""}">
          <span class="cal-num">${dayNum}</span>
          ${(byDay[dayNum] || []).map(e => `<span class="ev ${e.cls}">${esc(e.label)}</span>`).join("")}
        </div>`;
    }
  }
  $("calWrap").innerHTML = `
    <div class="cal-head">
      <h2>${now.toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</h2>
      <div class="cal-legend">
        <span><i class="ev-job"></i>Jobs</span><span><i class="ev-visit"></i>Visits &amp; quotes</span>
        <span><i class="ev-money"></i>Money</span><span><i class="ev-done"></i>Done</span>
      </div>
      <button class="btn-primary">+ New appointment</button>
    </div>
    <div class="cal-grid cal-dows">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="cal-dow">${d}</div>`).join("")}</div>
    <div class="cal-grid">${cells}</div>`;
}

});

$("modalOverlay").addEventListener("click", e => { if (e.target.id === "modalOverlay") closeModal(); });
$("drawerOverlay").addEventListener("click", e => { if (e.target.id === "drawerOverlay") closeDrawer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeDrawer(); $("docOverlay").classList.remove("show"); } });
$("docOverlay").addEventListener("click", e => { if (e.target.id === "docOverlay") $("docOverlay").classList.remove("show"); });

$("reseedBtn").addEventListener("click", () => {
  if (!confirm("Wipe all data and restore the demo customers?")) return;
  localStorage.removeItem(DEFAULTS.storageKey);
  load();
  populateFilters();
  renderAll();
  if (activeView === "settings") renderSettings();
  toast("Demo data restored");
});

/* ---------- render everything ---------- */
function renderAll() {
  renderOverdue();
  renderBoard();
  renderContacts();
  const od = agendaItems().filter(i => i.due && i.days < 0).length;
  $("todayBadge").hidden = od === 0;
  $("todayBadge").textContent = od;
  if (activeView === "today") renderToday();
  if (activeView === "dashboard") renderDashboard();
}

load();
populateFilters();
renderAll();
</script>
</body>
</html>
